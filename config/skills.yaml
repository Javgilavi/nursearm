# Skill registry. Primitive skills emit direct commands to the robot.
# VLA skills run a language-conditioned lerobot policy rollout.
# Set policy_path once a model is trained.

skills:
  home:
    type: primitive
    class: nursearm.skills.primitives.HomeSkill
    description: >
      Move the robot arm to its home/rest position. Use before and after
      any manipulation task to return to a safe neutral pose.
    enabled: true

  grip:
    type: primitive
    class: nursearm.skills.primitives.GripSkill
    description: >
      Close the gripper to grasp an object. Use when the arm is positioned
      over the target object and ready to pick it up.
    enabled: true

  release:
    type: primitive
    class: nursearm.skills.primitives.ReleaseSkill
    description: >
      Open the gripper to release a held object. Use when the arm has
      delivered the object to the target location.
    enabled: true

  move_up:
    type: primitive
    class: nursearm.skills.primitives.MoveUp
    description: >
      Move the robot end-effector up by one step (default 3 cm) via IK.
      Args: {step_m: <metres>}.
    enabled: true

  move_down:
    type: primitive
    class: nursearm.skills.primitives.MoveDown
    description: >
      Move the robot end-effector down by one step (default 3 cm) via IK.
      Args: {step_m: <metres>}.
    enabled: true

  move_forward:
    type: primitive
    class: nursearm.skills.primitives.MoveForward
    description: >
      Move the robot end-effector forward (away from base) by one step
      (default 3 cm) via IK. Args: {step_m: <metres>}.
    enabled: true

  move_back:
    type: primitive
    class: nursearm.skills.primitives.MoveBack
    description: >
      Move the robot end-effector backward (toward base) by one step
      (default 3 cm) via IK. Args: {step_m: <metres>}.
    enabled: true

  move_left:
    type: primitive
    class: nursearm.skills.primitives.MoveLeft
    description: >
      Move the robot end-effector left by one step (default 3 cm) via IK.
      Args: {step_m: <metres>}.
    enabled: true

  move_right:
    type: primitive
    class: nursearm.skills.primitives.MoveRight
    description: >
      Move the robot end-effector right by one step (default 3 cm) via IK.
      Args: {step_m: <metres>}.
    enabled: true

  sort_pills:
    type: vla
    class: nursearm.skills.sort_pills.SortPills
    description: >
      Sort the two pills into their matching cups: the green pill into the green cup and
      the black pill into the black cup. Runs the trained ACT pick-and-place policy
      end-to-end from the cameras. Use when the person asks to sort, organise, or put
      away the pills into the cups. Args: {duration_s: <optional seconds>}.
    task: "Sort two mock pills, green to green cup and black to black cup"
    policy_env: NURSEARM_SORT_PILLS_POLICY
    enabled: true

  sort_pills_smolvla:
    type: vla
    class: nursearm.skills.sort_pills_smolvla.SortPillsSmolVLA
    description: >
      Use the SmolVLA vision-language-action model to classify and sort pills into their
      matching containers. Downloads the checkpoint from HuggingFace automatically if
      NURSEARM_SORT_SMOLVLA_POLICY is not set to a local directory.
      Args: {task: <optional override>, duration_s: <optional seconds>}.
    task: "Sort the pills into the matching containers"
    policy_env: NURSEARM_SORT_SMOLVLA_POLICY
    enabled: true

  handover_pill:
    type: vla
    class: nursearm.skills.handover_pill.HandoverPill
    description: >
      Pick up one pill and present it to the person's hand using the trained ACT
      handover policy. The requested color is required and must be green or black.
      Args: {color: "green" | "black", duration_s: <optional seconds>}.
    task: "Give the {color} pill to the hand"
    policy_env: NURSEARM_HANDOVER_PILLS_POLICY
    enabled: true
