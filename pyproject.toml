[project]
name = "nursearm"
version = "0.1.0"
description = "SO-101 robot arm controlled through LLM-selected primitives and ACT policies."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pydantic>=2.7",
    "mcp>=1.0,<2",
    "faster-whisper>=1.1",
    "segno>=1.6.6",
    "mediapipe>=0.10.35",
    "anthropic>=0.100",
]

# NOTE on LeRobot: it is NOT a hard dependency here on purpose. LeRobot pins torch to a
# CUDA wheel index, which makes it painful as a transitive dep. Install it into the SAME
# venv as NurseArm (see README "Installing LeRobot"). The [robot] extra below adds the
# camera/vision deps that DO resolve cleanly.
[project.optional-dependencies]
robot = [
    "pyrealsense2>=2.55",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[project.scripts]
nursearm-serve = "nursearm.interface.server:main"
nursearm-mcp = "nursearm.mcp.server:main"
nursearm-mcp-client = "nursearm.mcp.client:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nursearm*"]

[tool.setuptools.package-data]
nursearm = ["interface/web/*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
