<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NurseArm Console</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="header">
        <div>
          <p class="eyebrow">NurseArm</p>
          <h1>Operator Console</h1>
          <p class="subtitle">Camera 1 top left, Camera 2 bottom left, chat on the right.</p>
        </div>
      </header>

      <main class="layout" id="layout">
        <section class="camera-column" id="camera-column">
          <section class="panel camera-panel">
            <p class="panel-kicker">Camera 1</p>
            <div class="camera-stage">
              <img id="camera-frame-1" class="camera-frame" alt="Camera 1 view" src="/frame" />
            </div>
          </section>

          <div class="splitter splitter-horizontal" id="camera-splitter" role="separator" aria-label="Resize camera panes" aria-orientation="horizontal" tabindex="0"></div>

          <section class="panel camera-panel">
            <p class="panel-kicker">Camera 2</p>
            <div class="camera-stage">
              <img id="camera-frame-2" class="camera-frame" alt="Camera 2 view" src="/frame" />
            </div>
          </section>
        </section>

        <div class="splitter splitter-vertical" id="layout-splitter" role="separator" aria-label="Resize chat panel" aria-orientation="vertical" tabindex="0"></div>

        <section class="panel chat-panel">
          <div class="chat-head">
            <div>
              <p class="panel-kicker">Chat</p>
              <h2>Operator instructions</h2>
            </div>
          </div>

          <div class="chat-tip">Try: "Give me my morning pills".</div>

          <div id="chat-messages" class="chat-messages"></div>

          <div class="composer-shell">
            <form id="chat-form" class="chat-form">
              <label class="sr-only" for="chat-input">Message</label>
              <input id="chat-input" name="message" type="text" autocomplete="off" placeholder="Type your instruction here" />
              <button type="submit" class="send-button">Send</button>
            </form>
          </div>
        </section>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
